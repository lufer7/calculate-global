# One-command production stack: game server + Caddy (automatic HTTPS).
#   cd deploy && cp .env.example .env && nano .env && docker compose up -d --build
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      DB_PATH: /data/arena.db
      TRUST_PROXY: "1"
    volumes:
      - gamedata:/data
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"

  caddy:
    image: caddy:2.10
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env dosyasında ayarlanmalı}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  gamedata:
  caddy_data:
  caddy_config:
